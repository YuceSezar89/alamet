<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alamet İzleme</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1b1f24;--mute:#68717d;--line:#e3e6ea;--ok:#1a8f4b;--warn:#c27a00;--bad:#c93232;--acc:#2456d6;--side:#fff;--hl:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1115;--card:#171b21;--ink:#e6e9ed;--mute:#8d96a3;--line:#262c34;--ok:#3ccf7a;--warn:#e5a93a;--bad:#ff6b6b;--acc:#7aa2ff;--side:#12161b;--hl:#1b2434}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside h1{font-size:16px;margin:2px 8px 12px}
aside h4{margin:14px 8px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
aside button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit}
aside button:hover{background:var(--hl)}
aside button.on{background:var(--hl);color:var(--acc);font-weight:600}
main{padding:16px;min-width:0;max-width:1180px;width:100%}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h2{margin:0;font-size:18px}
.menu{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card small{display:block;color:var(--mute);font-size:12px}
.card b{font-size:16px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--mute)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mute{color:var(--mute)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
section{display:none}section.on{display:block}
h3{font-size:14px;margin:18px 0 8px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px;cursor:pointer;user-select:none}
th.sorted{color:var(--acc)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.best td{background:var(--hl)}
.empty{padding:18px;color:var(--mute)}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;border:1px solid var(--line);font-size:12px}
.note{color:var(--mute);font-size:12px;margin:8px 2px}
.filter{width:100%;max-width:320px;margin:0 0 8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:12px}
.kv div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px}
.kv span{color:var(--mute)}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:600;padding:6px 2px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block}
.chart h3{margin:0 0 6px}
.lnk{color:var(--acc);font-weight:600;text-decoration:none;cursor:pointer}
.sel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sel input{max-width:200px;margin:0}
g.pick{cursor:pointer}
.wibar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.wibar label{color:var(--mute);font-size:12px}
.wis,.wi input[type=number],.wi input[type=text],.wi select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.wi input[type=number]{width:110px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
tr.chg td{background:var(--hl)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;z-index:5;width:230px;transform:translateX(-100%);transition:.2s}aside.open{transform:none;box-shadow:0 0 30px #0006}.menu{display:inline-block}}
</style>
</head>
<body>
<div class="app">
<aside id="side"><h1>Alamet · izleme</h1><div id="nav"></div></aside>
<main>
<div class="top"><button class="menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><h2 id="title">Özet</h2></div>
<div class="cards" id="cards"></div>
<section id="s-summary"></section>
<section id="s-cand"></section>
<section id="s-divergence"></section>
<section id="s-hoca-trades"></section>
<section id="s-hoca-cash"></section>
<section id="s-hoca-reasons"></section>
<section id="s-hoca-engine"></section>
<section id="s-hoca-methods"></section>
<section id="s-symbols"></section>
<section id="s-charts"></section>
<section id="s-open"></section>
<section id="s-orders"></section>
<section id="s-history"></section>
<section id="s-events"></section>
<section id="s-settings"></section>
<p class="note">İzleme sekmeleri salt okunurdur (Ayarlar sekmesindeki denemeler yalnızca geçmiş veride hesaplanır). Saatler tarayıcı saatinle ve UTC olarak yazılır. Hoca tabloları "şu anki" durumu gösterir (Pine'daki son bar gibi). Sayfa 5 sn'de bir yenilenir.</p>
</main>
</div>
<script>
const $=id=>document.getElementById(id);
const NAV=[["Genel",[["summary","Özet"],["cand","Adaylar"],["divergence","Ayrışma"]]],
 ["Hoca tabloları",[["hoca-trades","İşlemler"],["hoca-cash","Kasa"],["hoca-reasons","Kayıp / Kazanç sebebi"],["hoca-engine","Kasa motoru"],["hoca-methods","Yöntem × Emtia"]]],
 ["Sistem",[["symbols","Tüm semboller"],["charts","Grafikler"],["open","Açık işlemler"],["orders","Emirler"],["history","Geçmiş işlemler"],["events","Olaylar"],["settings","Ayarlar"]]]];
const TITLES={};NAV.forEach(([,items])=>items.forEach(([k,t])=>TITLES[k]=t));
let cur=localStorage.getItem("tab")||"summary";if(!TITLES[cur])cur="summary";
const DATA={all:null,tables:null,symbols:null,charts:null,settings:null};
const p2=n=>String(n).padStart(2,"0");
function fmt(ts){if(!ts)return"-";const d=new Date(ts*1000);
 return `${p2(d.getDate())}.${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())} <span class="mute">(UTC ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())})</span>`}
const num=(v,d)=>{d=typeof d==="number"?d:2;return v==null?"-":(typeof v==="string"?v:Number(v).toFixed(d))};
const sgn=(v,d)=>{d=typeof d==="number"?d:2;return v==null?"-":(typeof v==="string"?v:`<span class="${v>=0?"ok":"bad"}">${Number(v).toFixed(d)}</span>`)};
const sideTxt=s=>s==1?'<span class="ok">LONG</span>':(s==-1?'<span class="bad">SHORT</span>':'<span class="mute">-</span>');
const yn=b=>b?'<span class="ok">var</span>':'<span class="mute">yok</span>';
const METH=["Trend","Momentum","Volatilite","Hacim"];
const symLink=v=>`<a class="lnk" onclick="goDiv('${v}')">${v}</a>`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---- sıralanabilir / aranabilir tablo ---- */
const TB={};const OPEN={};
function det(id,title,html,dflt){const o=id in OPEN?OPEN[id]:dflt;return`<details ${o?"open":""} ontoggle="OPEN['${id}']=this.open"><summary>${title}</summary>${html}</details>`}
function tableHtml(id){const t=TB[id];let rows=t.rows;
 if(t.filter){const q=t.filter.toLowerCase();rows=rows.filter(r=>t.cols.some(c=>String(c.raw?c.raw(r):r[c.k]??"").toLowerCase().includes(q)))}
 if(t.sort!=null){const c=t.cols[t.sort],g=r=>c.raw?c.raw(r):r[c.k];
  rows=[...rows].sort((a,b)=>{let x=g(a),y=g(b);if(x==null)return 1;if(y==null)return-1;
   if(typeof x==="string"&&typeof y==="string")return t.dir*x.localeCompare(y);return t.dir*(x-y)})}
 if(!rows.length)return'<div class="empty">Kayıt yok.</div>';
 const head=t.cols.map((c,i)=>`<th class="${c.num?"n":""} ${t.sort===i?"sorted":""}" onclick="srt('${id}',${i})">${c.h}${t.sort===i?(t.dir>0?" ▲":" ▼"):""}</th>`).join("");
 const body=rows.slice(0,t.limit||600).map(r=>`<tr class="${t.rowClass?t.rowClass(r):""}">${t.cols.map(c=>`<td class="${c.num?"n":""}">${c.f?c.f(r[c.k],r):(r[c.k]??"-")}</td>`).join("")}</tr>`).join("");
 return`<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`+(rows.length>(t.limit||600)?`<p class="note">İlk ${(t.limit||600)} satır gösteriliyor (${rows.length} kayıt).</p>`:"")}
function mount(id,cols,rows,opts={}){const old=TB[id]||{};TB[id]={cols,rows,sort:old.sort??opts.sort??null,dir:old.dir??opts.dir??1,filter:old.filter||"",...opts,sort:old.sort??opts.sort??null,dir:old.dir??opts.dir??1}
 const el=$("tb-"+id);if(el){el.innerHTML=tableHtml(id)}return`${opts.search?`<input class="filter" placeholder="Ara…" value="${esc(TB[id].filter)}" oninput="flt('${id}',this.value)">`:""}<div id="tb-${id}">${tableHtml(id)}</div>`}
function srt(id,i){const t=TB[id];if(t.sort===i)t.dir=-t.dir;else{t.sort=i;t.dir=t.cols[i].num?-1:1}$("tb-"+id).innerHTML=tableHtml(id)}
function flt(id,v){TB[id].filter=v;$("tb-"+id).innerHTML=tableHtml(id)}
function kv(pairs){return`<div class="kv">${pairs.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join("")}</div>`}

/* ---- SVG grafikler ---- */
function lineChart(points,title,fmtV=v=>v.toFixed(2)){
 if(points.length<2)return`<div class="chart"><h3>${title}</h3><div class="empty">Yeterli veri yok.</div></div>`;
 const W=640,H=220,L=48,R=10,T=10,B=24,xs=points.map(p=>p.t),ys=points.map(p=>p.v);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),dy=(y1-y0)||1,dx=(x1-x0)||1;
 const X=t=>L+(t-x0)/dx*(W-L-R),Y=v=>T+(1-(v-y0)/dy)*(H-T-B);
 const d=points.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
 const ticks=[0,.5,1].map(f=>y0+f*dy);
 const dates=[x0,(x0+x1)/2,x1].map(t=>{const q=new Date(t*1000);return`${p2(q.getDate())}.${p2(q.getMonth()+1)}`});
 return`<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmtV(v)}</text>`).join("")}
 ${dates.map((s,i)=>`<text x="${L+i*(W-L-R)/2}" y="${H-6}" text-anchor="${i==0?"start":i==2?"end":"middle"}" font-size="11" fill="var(--mute)">${s}</text>`).join("")}
 <path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/></svg></div>`}
function barChart(items,title,labelOf=i=>i.label){
 if(!items.length)return`<div class="chart"><h3>${title}</h3><div class="empty">Yeterli veri yok.</div></div>`;
 const W=640,H=220,L=36,R=10,T=14,B=58,n=items.length,m=Math.max(...items.map(i=>i.n),1),bw=(W-L-R)/n;
 return`<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}">
 ${items.map((it,i)=>{const h=(it.n/m)*(H-T-B),x=L+i*bw;return`<rect x="${x+2}" y="${H-B-h}" width="${Math.max(bw-4,1)}" height="${h}" fill="var(--acc)" rx="2"/>
 <text x="${x+bw/2}" y="${H-B-h-3}" text-anchor="middle" font-size="10" fill="var(--ink)">${it.n||""}</text>
 <text transform="translate(${x+bw/2},${H-B+10}) rotate(40)" font-size="10" fill="var(--mute)">${esc(labelOf(it))}</text>`}).join("")}</svg></div>`}

/* ---- sekmeler ---- */
function nav(){$("nav").innerHTML=NAV.map(([g,items])=>`<h4>${g}</h4>`+items.map(([k,t])=>`<button class="${k==cur?"on":""}" onclick="pick('${k}')">${t}</button>`).join("")).join("");
 Object.keys(TITLES).forEach(k=>$("s-"+k).className=k==cur?"on":"");$("title").textContent=TITLES[cur];$("cards").style.display=cur=="summary"?"grid":"none"}
function pick(k){cur=k;localStorage.setItem("tab",k);$("side").classList.remove("open");nav();ensure();draw()}
const NEED={"hoca-trades":"tables","hoca-cash":"tables","hoca-reasons":"tables","hoca-engine":"tables","hoca-methods":"tables",symbols:"symbols",charts:"charts",summary:"charts"};
async function load(key){try{const r=await fetch("/api/"+key);DATA[key]=await r.json()}catch(e){DATA[key]=null}}
async function ensure(){if(cur==="divergence"){await loadDiv();draw();return}if(cur==="settings"){await wiLoad();draw();return}const need=NEED[cur];if(need){await load(need);draw()}}


/* ---- Ayrışma sekmesi ---- */
let DIVSEL=localStorage.getItem("divsym")||"";
async function loadDiv(){
 try{DATA.divOv=await (await fetch("/api/divergence/overview")).json()}catch(e){DATA.divOv=[]}
 if(!DATA.symbols)await load("symbols");
 const names=(DATA.symbols||[]).map(x=>x.symbol);
 if(!DIVSEL||(names.length&&!names.includes(DIVSEL)))DIVSEL=(DATA.divOv[0]||{}).symbol||names[0]||"BTC";
 try{DATA.divDetail=await (await fetch("/api/divergence?symbol="+encodeURIComponent(DIVSEL))).json()}catch(e){DATA.divDetail=null}}
function goDiv(sym){sym=String(sym||"").trim().toUpperCase();if(!sym)return;DIVSEL=sym;localStorage.setItem("divsym",sym);if(cur!=="divergence")pick("divergence");else loadDiv().then(draw)}
function overviewChart(list){
 if(!list.length)return`<div class="chart"><h3>Şu an ayrışmada olan semboller</h3><div class="empty">Şu an ilk-2'de sembol yok.</div></div>`;
 const rowH=28,W=640,L=96,R=70,T=26,H=T+list.length*rowH+8,max=Math.max(5,...list.map(r=>r.ratio||0));
 const X=v=>L+Math.min(v,max)/max*(W-L-R);
 const rows=list.map((r,i)=>{const y=T+i*rowH,col=r.ready?"var(--ok)":(r.double?"var(--warn)":"var(--mute)"),w=r.ratio==null?0:Math.max(X(r.ratio)-L,2);
  const txt=r.ratio==null?"geçmiş yetersiz":`${r.ratio.toFixed(2)}×`;
  return`<g class="pick" onclick="goDiv('${r.symbol}')"><title>${r.symbol}: hareket ${num(r.current)}% · eşik ${num(r.threshold)}% · ayrışma no ${r.number}${r.ready?" · işlem için hazır":""}</title>
  <text x="${L-8}" y="${y+16}" text-anchor="end" font-size="12" fill="var(--ink)" font-weight="${r.symbol===DIVSEL?700:400}">${r.symbol} ${r.side==1?"▲":"▼"}</text>
  <rect x="${L}" y="${y+4}" width="${w}" height="16" rx="3" fill="${col}" opacity="${r.symbol===DIVSEL?1:.75}"/>
  <text x="${L+w+6}" y="${y+16}" font-size="11" fill="var(--mute)">${txt}</text></g>`}).join("");
 return`<div class="chart"><h3>Şu an ayrışmada olan semboller · güncel hareket ÷ çift ayrışma eşiği</h3><svg viewBox="0 0 ${W} ${H}">
 <line x1="${X(1)}" x2="${X(1)}" y1="${T-8}" y2="${H-4}" stroke="var(--warn)" stroke-dasharray="4 3"/><text x="${X(1)}" y="${T-12}" text-anchor="middle" font-size="11" fill="var(--warn)">eşik (1×)</text>${rows}</svg>
 <p class="note">Yeşil: işlem için hazır · turuncu: çift ayrışma var ama yön kilidi geçmedi · gri: çift ayrışma yok. Çubuğa tıklayınca sembol seçilir.</p></div>`}
function priceChart(d){
 const pr=d.price||[];if(pr.length<2)return`<div class="chart"><h3>Fiyat</h3><div class="empty">Fiyat verisi yok.</div></div>`;
 const W=720,H=270,L=58,R=12,T=16,B=26,x0=pr[0].t,x1=pr[pr.length-1].t,dx=(x1-x0)||1;
 let lo=Math.min(...pr.map(p=>p.c)),hi=Math.max(...pr.map(p=>p.c));
 const sp=d.leg&&d.leg.start_price,ot=d.open_trade;[sp,ot&&ot.entry].forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}});
 d.trades.forEach(t=>{[t.entry,t.exit].forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}})});
 const pad=(hi-lo)*.06||hi*.01;lo-=pad;hi+=pad;const dy=hi-lo;
 const X=t=>L+(Math.min(Math.max(t,x0),x1)-x0)/dx*(W-L-R),Y=v=>T+(1-(v-lo)/dy)*(H-T-B);
 const near=t=>{let a=0,b=pr.length-1;while(a<b){const m=(a+b)>>1;if(pr[m].t<t)a=m+1;else b=m}return pr[a]};
 const path=pr.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.c).toFixed(1)}`).join(" ");
 const fp=v=>v>=100?v.toFixed(2):(v>=1?v.toFixed(4):v.toFixed(6));
 const ticks=[0,.5,1].map(f=>lo+f*dy),dates=[x0,(x0+x1)/2,x1].map(t=>{const q=new Date(t*1000);return`${p2(q.getDate())}.${p2(q.getMonth()+1)} ${p2(q.getHours())}:${p2(q.getMinutes())}`});
 let m="";
 (d.events||[]).forEach(e=>{const p=near(e.t),x=X(e.t),y=Y(p.c);
  if(e.double)m+=`<text x="${x}" y="${y-8}" text-anchor="middle" font-size="14" fill="#e5a93a"><title>Çift ayrışma · no ${e.no} · hareket ${num(e.move)}%</title>★</text>`;
  else m+=`<text x="${x}" y="${e.dir==1?y+13:y-5}" text-anchor="middle" font-size="11" fill="${e.dir==1?"var(--ok)":"var(--bad)"}"><title>Ayrışma no ${e.no} (${e.dir==1?"LONG":"SHORT"})</title>${e.dir==1?"▲":"▼"}</text>`});
 (d.trades||[]).forEach(t=>{const c=t.side==1?"var(--ok)":"var(--bad)";
  if(t.open_time>=x0)m+=`<circle cx="${X(t.open_time)}" cy="${Y(t.entry)}" r="4" fill="${c}"><title>Giriş ${t.side==1?"LONG":"SHORT"} ${fp(t.entry)}</title></circle>`;
  m+=`<rect x="${X(t.close_time)-3.5}" y="${Y(t.exit)-3.5}" width="7" height="7" fill="none" stroke="${c}" stroke-width="2"><title>Çıkış ${fp(t.exit)} · R ${num(t.r)}</title></rect>`;
  if(t.open_time>=x0)m+=`<line x1="${X(t.open_time)}" y1="${Y(t.entry)}" x2="${X(t.close_time)}" y2="${Y(t.exit)}" stroke="${c}" stroke-dasharray="3 3" opacity=".7"/>`});
 let lines="";
 if(sp!=null)lines+=`<line x1="${L}" x2="${W-R}" y1="${Y(sp)}" y2="${Y(sp)}" stroke="var(--acc)" stroke-dasharray="6 4"/><text x="${W-R}" y="${Y(sp)-4}" text-anchor="end" font-size="11" fill="var(--acc)">güncel bacağın başlangıcı ${fp(sp)}</text>`;
 if(ot)lines+=`<line x1="${L}" x2="${W-R}" y1="${Y(ot.entry)}" y2="${Y(ot.entry)}" stroke="${ot.side==1?"var(--ok)":"var(--bad)"}" stroke-dasharray="2 3"/><text x="${L+4}" y="${Y(ot.entry)-4}" font-size="11" fill="var(--mute)">açık işlem girişi ${fp(ot.entry)}</text>`;
 return`<div class="chart"><h3>${d.symbol} · fiyat (son 7 gün, 15 dk)</h3><svg viewBox="0 0 ${W} ${H}">
 ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fp(v)}</text>`).join("")}
 ${dates.map((s,i)=>`<text x="${L+i*(W-L-R)/2}" y="${H-6}" text-anchor="${i==0?"start":i==2?"end":"middle"}" font-size="11" fill="var(--mute)">${s}</text>`).join("")}
 <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.4" opacity=".85"/>${lines}${m}</svg>

function legChart(leg){
 const ls=leg.legs||[];if(!ls.length)return`<div class="chart"><h3>Bacak hareketleri</h3><div class="empty">Bu sembolde henüz ayrışma yok.</div></div>`;
 const W=720,H=250,L=52,R=60,T=16,B=34,vals=ls.map(l=>l.move).filter(v=>v!=null);
 let lo=Math.min(0,...vals,leg.threshold??0,leg.mean??0),hi=Math.max(0,...vals,leg.threshold??0);const pad=(hi-lo)*.08||1;lo-=pad;hi+=pad;
 const Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B),n=ls.length,bw=(W-L-R)/n;
 const bars=ls.map((l,i)=>{const x=L+i*bw,v=l.move;if(v==null)return"";const y0=Y(0),y=Y(v),top=Math.min(y,y0),h=Math.abs(y-y0)||1;
  return`<rect x="${x+4}" y="${top}" width="${Math.max(bw-8,2)}" height="${h}" fill="${v>=0?"var(--ok)":"var(--bad)"}" opacity="${l.current?1:.6}" ${l.current?'stroke="var(--acc)" stroke-width="2"':""} rx="2"><title>Bacak #${l.no}: ${v.toFixed(2)}%${l.current?(leg.active?" (güncel, sürüyor)":" (son, bitti)"):""}</title></rect>
  <text x="${x+bw/2}" y="${v>=0?top-4:top+h+11}" text-anchor="middle" font-size="10" fill="var(--ink)">${v.toFixed(1)}</text>
  <text x="${x+bw/2}" y="${H-B+14}" text-anchor="middle" font-size="10" fill="var(--mute)">#${l.no}</text>`}).join("");
 const thr=leg.threshold!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(leg.threshold)}" y2="${Y(leg.threshold)}" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${W-R+4}" y="${Y(leg.threshold)+4}" font-size="11" fill="var(--warn)">eşik ${leg.threshold.toFixed(2)}</text>`:"";
 const mean=leg.mean!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(leg.mean)}" y2="${Y(leg.mean)}" stroke="var(--mute)" stroke-dasharray="2 3"/><text x="${W-R+4}" y="${Y(leg.mean)+4}" font-size="11" fill="var(--mute)">ort ${leg.mean.toFixed(2)}</text>`:"";
 return`<div class="chart"><h3>Bacak hareketleri (güncel yön lehine, %)</h3><svg viewBox="0 0 ${W} ${H}">
 <line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>${[lo,hi].map(v=>`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${v.toFixed(1)}</text>`).join("")}${bars}${mean}${thr}</svg>
 <p class="note">Mavi çerçeveli çubuk güncel bacak. Çift ayrışma: güncel bacak, önceki bacakların ortalaması + ${leg.z_min}σ (turuncu çizgi) eşiğini aşınca oluşur. En az ${leg.min_prev} önceki bacak gerekir.</p></div>`}

let SETQ="";
const WI={fields:null,byCode:{},windows:{},costs:{},tfs:{},draft:{},window:"all",cost:"ayar",tf:"900",res:null,run:null,error:null};
try{const s=JSON.parse(localStorage.getItem("wi")||"{}");if(s.draft&&typeof s.draft==="object")WI.draft=s.draft;if(s.window)WI.window=s.window;if(s.cost)WI.cost=s.cost;if(s.tf)WI.tf=String(s.tf)}catch(e){}
function wiSave(){try{localStorage.setItem("wi",JSON.stringify({draft:WI.draft,window:WI.window,cost:WI.cost,tf:WI.tf}))}catch(e){}}
async function wiLoad(){if(WI.fields)return;
 try{const d=await (await fetch("/api/whatif/fields")).json();WI.fields=d.fields;WI.windows=d.windows;WI.costs=d.costs;WI.tfs=d.tfs||{900:"15 dk"};WI.byCode={};d.fields.forEach(f=>WI.byCode[f.code]=f);
  Object.keys(WI.draft).forEach(c=>{if(!WI.byCode[c])delete WI.draft[c]});if(!WI.windows[WI.window])WI.window="all";if(!WI.costs[WI.cost])WI.cost="ayar";if(!WI.tfs[WI.tf])WI.tf="900"}catch(e){WI.fields=null}}
function wiShow(f,v){if(f.kind==="select"){const o=f.options.find(o=>o.v===v);return o?o.l:String(v)}if(f.kind==="bool")return v?"Açık":"Kapalı";return String(v)}
function wiInput(f){const v=f.code in WI.draft?WI.draft[f.code]:f.default,c=escA(f.code);
 if(f.kind==="bool")return`<input type="checkbox" data-code="${c}" ${v?"checked":""} onchange="wiSet(this)">`;
 if(f.kind==="select")return`<select data-code="${c}" onchange="wiSet(this)">${f.options.map((o,i)=>`<option value="${i}" ${o.v===v?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
 if(f.kind==="text")return`<input type="text" data-code="${c}" value="${escA(v)}" onchange="wiSet(this)">`;
 return`<input type="number" data-code="${c}" value="${v}" step="${f.kind==="int"?1:"any"}" onchange="wiSet(this)">`}
function wiSet(el){const f=WI.byCode[el.dataset.code];let v;
 if(f.kind==="bool")v=el.checked;else if(f.kind==="select")v=f.options[+el.value].v;else if(f.kind==="text")v=el.value;
 else{v=parseFloat(el.value);if(!isFinite(v)){el.value=f.code in WI.draft?WI.draft[f.code]:f.default;return}if(f.kind==="int")v=Math.round(v)}
 if(v===f.default)delete WI.draft[f.code];else WI.draft[f.code]=v;
 wiSave();wiRefreshRow(f.code);wiRefreshBar()}
function wiRefreshRow(code){const tr=document.querySelector(`tr[data-row="${code}"]`);if(!tr)return;const chg=code in WI.draft;tr.classList.toggle("chg",chg);const b=tr.querySelector("button");if(b)b.style.visibility=chg?"visible":"hidden"}
function wiRefreshBar(){const n=Object.keys(WI.draft).length,b=$("wi-reset");if(b){b.disabled=!n;b.textContent="↺ Varsayılana dön"+(n?` (${n} değişiklik)`:"")}}
function wiReset(code){delete WI.draft[code];wiSave();wiRenderGroups();wiRefreshBar()}
function wiResetAll(){WI.draft={};wiSave();wiRenderGroups();wiRefreshBar()}
function wiBar(){return`<div class="wibar"><button class="btn" id="wi-reset" onclick="wiResetAll()">↺ Varsayılana dön</button>
 <label>Sinyal TF <select class="wis" onchange="WI.tf=this.value;wiSave()">${Object.entries(WI.tfs).map(([k,t])=>`<option value="${k}" ${k===WI.tf?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
 <label>Pencere <select class="wis" onchange="WI.window=this.value;wiSave()">${Object.entries(WI.windows).map(([k,t])=>`<option value="${k}" ${k===WI.window?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
 <label>Maliyet <select class="wis" onchange="WI.cost=this.value;wiSave()">${Object.entries(WI.costs).map(([k,t])=>`<option value="${k}" ${k===WI.cost?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
 <button class="btn pri" id="wi-run" onclick="wiRun()">▶ Koştur</button><span id="wi-status" class="mute"></span></div>`}
async function wiPost(overrides){const r=await fetch("/api/whatif",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({overrides,window:WI.window,cost:WI.cost,tf:Number(WI.tf)})});
 const d=await r.json();if(!r.ok)throw new Error(d.error||"istek reddedildi");return d.id}
async function wiRun(){if(WI.run)return;WI.error=null;const ov={...WI.draft},has=Object.keys(ov).length>0;
 WI.run={started:Date.now(),ids:{}};WI.res={base:null,draft:has?null:undefined,ov,window:WI.window,cost:WI.cost,tf:WI.tf};wiRenderRun();wiRenderResult();
 try{WI.run.ids.base=await wiPost({});if(has)WI.run.ids.draft=await wiPost(ov)}catch(e){WI.error=String(e.message||e);WI.run=null;wiRenderRun();return}
 wiPoll()}
async function wiPoll(){const run=WI.run;if(!run)return;let pending=false;
 try{for(const k of Object.keys(run.ids)){if(WI.res[k])continue;const resp=await fetch("/api/whatif/"+run.ids[k]);const d=await resp.json();
   if(resp.status===404){WI.error="Sunucu yeniden başlatıldığı için koşu kayboldu. Tekrar Koştur'a basın."}
   else if(d.status==="done")WI.res[k]=d.result;else if(d.status==="error"){WI.error=d.error}else pending=true}
  run.fails=0}
 catch(e){run.fails=(run.fails||0)+1;if(run.fails>=10)WI.error="Sunucuya ulaşılamadı ("+e+"). Sunucu yeniden başlatılmış olabilir; tekrar Koştur'a basın.";else pending=true}
 if(WI.error||!pending){WI.run=null}else setTimeout(wiPoll,run.fails?2000:1500);
 wiRenderRun();wiRenderResult()}
function wiRenderRun(){const b=$("wi-run"),s=$("wi-status");if(!b||!s)return;b.disabled=!!WI.run;
 if(WI.error)s.innerHTML=`<span class="bad">Hata: ${esc(WI.error)}</span>`;
 else if(WI.run){const sec=Math.round((Date.now()-WI.run.started)/1000);s.textContent=`Çalışıyor… ${sec} sn (tüm geçmişte ilk koşu ~1-2 dk sürebilir)`;setTimeout(()=>{if(WI.run)wiRenderRun()},1000)}
 else s.textContent=""}
const WI_ROWS=[["trades","İşlem",0,0],["ret","Getiri %",2,1],["final","Son kasa $",2,1],["max_dd","Maks. düşüş %",2,-1],["win_rate","Kazanma %",1,1],["profit_factor","Kâr faktörü (PF)",2,1],["avg_r","Ort. R",3,1],["long_share","Long payı %",0,0],["top10_share","İlk 10 işlemin kâr payı %",0,-1]];
const dt=ts=>new Date(ts*1000).toLocaleDateString("tr");
function twoLine(a,b,title){const pts=[...a,...(b||[])];if(pts.length<2)return"";
 const W=640,H=220,L=52,R=10,T=10,B=24,xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),dy=(y1-y0)||1,dx=(x1-x0)||1;
 const X=t=>L+(t-x0)/dx*(W-L-R),Y=v=>T+(1-(v-y0)/dy)*(H-T-B);
 const path=(s,col,w)=>`<path d="${s.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="${col}" stroke-width="${w}"/>`;
 const ticks=[0,.5,1].map(f=>y0+f*dy),dates=[x0,(x0+x1)/2,x1].map(dt);
 return`<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${v.toFixed(0)}</text>`).join("")}
 ${dates.map((s,i)=>`<text x="${L+i*(W-L-R)/2}" y="${H-6}" text-anchor="${i==0?"start":i==2?"end":"middle"}" font-size="11" fill="var(--mute)">${s}</text>`).join("")}
 ${path(a,"var(--mute)",1.5)}${b?path(b,"var(--acc)",2):""}</svg><p class="note" style="margin:4px 0 0"><span style="color:var(--mute)">━</span> Varsayılan ${b?'&nbsp; <span style="color:var(--acc)">━</span> Değiştirilmiş':""}</p></div>`}
function wiResultHtml(){const r=WI.res;if(!r)return"";
 if(!r.base)return`<div class="chart"><div class="empty">Hesaplanıyor…</div></div>`;
 const b=r.base.metrics,d=r.draft&&r.draft.metrics,one=r.draft===undefined;
 const cell=(v,dg)=>v==null?"-":Number(v).toFixed(dg);
 const rows=WI_ROWS.map(([k,l,dg,good])=>{let diff="";
  if(d&&b[k]!=null&&d[k]!=null){const x=d[k]-b[k],cls=good===0||x===0?"mute":((x>0)===(good>0)?"ok":"bad");diff=`<span class="${cls}">${x>0?"+":""}${x.toFixed(dg)}</span>`}
  return`<tr><td>${l}</td><td class="n">${cell(b[k],dg)}</td>${one?"":`<td class="n"><b>${d?cell(d[k],dg):"…"}</b></td><td class="n">${diff}</td>`}</tr>`}).join("");
 const changed=Object.entries(r.ov||{}).map(([c,v])=>{const f=WI.byCode[c];return f?`<li>${esc(f.label)}: <span class="mute">${esc(wiShow(f,f.default))}</span> → <b>${esc(wiShow(f,v))}</b></li>`:""}).join("");
 const act=(d?r.draft:r.base),t=(d||b).trades;
 let h=`<h3>Sonuç</h3><p class="note">${dt(act.from)} → ${dt(act.to)} · sinyal TF: ${esc(WI.tfs[r.tf]||r.tf)} · pencere: ${esc(WI.windows[r.window]||r.window)} · maliyet: ${esc(WI.costs[r.cost]||r.cost)} · geçmiş veride hesaplanmıştır, canlı bota etkisi yoktur.</p>`
  +`<div class="wrap"><table><thead><tr><th>Ölçüt</th><th class="n">Varsayılan</th>${one?"":'<th class="n">Değiştirilmiş</th><th class="n">Fark</th>'}</tr></thead><tbody>${rows}</tbody></table></div>`;
 if(changed)h+=`<p class="note" style="margin-bottom:2px">Değiştirilen ayarlar:</p><ul class="note" style="margin-top:0">${changed}</ul>`;
 if(t<30)h+=`<p class="note warn">Az işlem (${t}): bu sonuç rastlantı olabilir.</p>`;
 h+=`<p class="note">Sistem yola bağımlı olduğu için tek bir koşu yanıltıcı olabilir; farklı pencerelerde de bakın.</p>`;
 h+=twoLine(r.base.equity,d?r.draft.equity:null,"Kasa eğrisi (sanal kasa)");
 const tr=act.trades;
 if(tr.length)h+=det("wi-tr",`İşlemler <span class="mute">(son ${tr.length}${d?", değiştirilmiş ayarla":""})</span>`,mount("wi-trades",[{k:"symbol",h:"Sembol",f:v=>`<b>${v}</b>`},{k:"side",h:"Yön",f:sideTxt},{k:"open",h:"Açılış",f:fmt},{k:"close",h:"Kapanış",f:fmt},{k:"entry",h:"Giriş",num:1,f:v=>num(v,4)},{k:"exit",h:"Çıkış",num:1,f:v=>num(v,4)},{k:"usd",h:"Kâr/zarar $",num:1,f:sgn},{k:"r",h:"R",num:1,f:sgn},{k:"reason",h:"Neden",f:v=>REASON[v]??v}],tr,{search:1,limit:200}),false);
 return h}
function wiRenderResult(){const el=$("wi-result");if(el)el.innerHTML=wiResultHtml()}
function wiRenderGroups(){const el=$("wi-groups");if(!el)return;
 const q=SETQ.toLowerCase(),groups={};
 WI.fields.forEach(f=>{if(q&&!(f.label+" "+f.group).toLowerCase().includes(q))return;(groups[f.group]??=[]).push(f)});
 let h="";
 Object.entries(groups).forEach(([g,list],i)=>{const nch=list.filter(f=>f.code in WI.draft).length;
  h+=det("set"+g,`${esc(g)} <span class="mute">(${list.length})</span>${nch?` <span class="tag">${nch} değişti</span>`:""}`,
   `<div class="wrap wi"><table><tbody>${list.map(f=>{const chg=f.code in WI.draft;return`<tr data-row="${escA(f.code)}" class="${chg?"chg":""}" title="${escA(f.code)}"><td style="white-space:normal">${esc(f.label)}</td><td>${wiInput(f)}</td><td class="mute">varsayılan: ${esc(wiShow(f,f.default))}</td><td style="width:34px"><button class="btn" style="padding:1px 7px;visibility:${chg?"visible":"hidden"}" onclick="wiReset('${f.code}')" title="Varsayılana dön">↺</button></td></tr>`}).join("")}</tbody></table></div>`,q?true:(nch>0||i<3))});
 if(!Object.keys(groups).length)h='<div class="empty">Eşleşen ayar yok.</div>';
 el.innerHTML=h}
function setFilter(v){SETQ=v;wiRenderGroups()}
function drawSettings(){if(!WI.fields){$("s-settings").innerHTML='<div class="empty">Veri yok.</div>';return}
 $("s-settings").innerHTML=`<p class="note">Ayarları değiştirip <b>Koştur</b>'a basın: sonuç GEÇMİŞ veride hesaplanır ve varsayılanla yan yana gösterilir. Çalışan bota, veritabanına ve borsaya hiçbir etkisi yoktur. Değişiklikleriniz bu tarayıcıda saklanır.</p>`
  +wiBar()+`<div id="wi-result"></div><input class="filter" placeholder="Ayar ara…" value="${escA(SETQ)}" oninput="setFilter(this.value)"><div id="wi-groups"></div>`;
 wiRenderGroups();wiRefreshBar();wiRenderRun();wiRenderResult()}
function draw(){drawCards();
 const map={summary:drawSummary,cand:drawCand,divergence:drawDivergence,"hoca-trades":drawHocaTrades,"hoca-cash":drawHocaCash,"hoca-reasons":drawHocaReasons,"hoca-engine":drawHocaEngine,"hoca-methods":drawHocaMethods,symbols:drawSymbols,charts:drawCharts,open:drawOpen,orders:drawOrders,history:drawHistory,events:drawEvents,settings:drawSettings};
 (map[cur]||drawSummary)()}
async function tick(){try{const r=await fetch("/api/all");DATA.all=await r.json()}catch(e){$("cards").innerHTML=`<div class="card"><small>Hata</small><b class="bad">Veri alınamadı</b></div>`;return}
 if(cur==="settings"){if(!WI.fields){await wiLoad();draw()}else drawCards();return}
 if(cur==="divergence")await loadDiv();else{const need=NEED[cur];if(need)await load(need)}
 if(document.activeElement&&document.activeElement.tagName==="INPUT"){drawCards();return}
 draw()}
nav();tick();setInterval(tick,5000);
</script>
</body>
</html>
